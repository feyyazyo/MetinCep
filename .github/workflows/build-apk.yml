name: MetinCep APK Oluştur

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Paket sürüm aralıkları bu Flutter sürümüne göre doğrulandı. Değiştirmeniz önerilmez.
  FLUTTER_VERSION: '3.35.7'

jobs:
  build:
    # ubuntu-latest ileride Ubuntu 26.04'e geçecek; sürprizi önlemek için sabitlendi.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter bilgisi
        run: flutter --version

      - name: Android proje dosyalarını hazırla
        run: bash tool/setup_android.sh

      # KALİTE KAPILARI
      # continue-on-error KULLANILMAZ: bir adım başarısız olursa iş akışı orada
      # durur ve KIRMIZI olur. Sonraki adımlar "atlandı" görünür; hiçbir hata
      # gizlenmez ve başarısız testin üzerine APK üretilmez.

      - name: Temizlik (flutter clean)
        id: clean
        run: flutter clean

      - name: Paketleri indir (flutter pub get)
        id: pubget
        run: flutter pub get

      - name: 1/4 Kod analizi (flutter analyze)
        id: analyze
        run: flutter analyze

      - name: 2/4 Otomatik testler (flutter test)
        id: test
        run: flutter test --reporter expanded

      - name: 3/4 Release APK oluştur
        id: release
        run: flutter build apk --release

      - name: 4/4 Release güvenlik doğrulaması (Mock Pro kontrolü)
        id: guards
        run: bash tool/verify_release_guards.sh build/app/outputs/flutter-apk/app-release.apk

      # Aşağıdaki adımlar rapor/teşhis içindir; hata gizlemezler.

      - name: Debug APK oluştur (yalnızca release derlemesi kırıldıysa)
        id: debugapk
        if: failure() && steps.release.outcome == 'failure'
        run: flutter build apk --debug

      - name: APK boyutlarını göster
        if: always()
        run: ls -lh build/app/outputs/flutter-apk/*.apk || echo "APK üretilmedi"

      - name: APK dosyalarını yükle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MetinCep-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

      - name: PASS/FAIL raporu
        if: always()
        env:
          R_CLEAN: ${{ steps.clean.outcome }}
          R_PUBGET: ${{ steps.pubget.outcome }}
          R_ANALYZE: ${{ steps.analyze.outcome }}
          R_TEST: ${{ steps.test.outcome }}
          R_RELEASE: ${{ steps.release.outcome }}
          R_GUARDS: ${{ steps.guards.outcome }}
        run: |
          # success → PASS, failure → FAIL, çalışmadıysa (önceki adım kırıldı) → ATLANDI
          mark() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              *)       echo "ATLANDI" ;;
            esac
          }
          {
            echo "## MetinCep — Kalite Kontrol Raporu"
            echo
            echo "| Adım | Sonuç |"
            echo "|---|---|"
            echo "| flutter clean | $(mark "$R_CLEAN") |"
            echo "| flutter pub get | $(mark "$R_PUBGET") |"
            echo "| flutter analyze | $(mark "$R_ANALYZE") |"
            echo "| flutter test | $(mark "$R_TEST") |"
            echo "| flutter build apk --release | $(mark "$R_RELEASE") |"
            echo "| Release güvenlik doğrulaması | $(mark "$R_GUARDS") |"
            echo
            if [ "$R_RELEASE" = "success" ]; then
              echo "Release APK: **Artifacts → MetinCep-APK → app-release.apk**"
            else
              echo "Release APK üretilemedi (veya önceki bir kapı kırıldığı için sıra gelmedi)."
              echo "ATLANDI yazan adımlar çalışmadı; ilk FAIL adımının günlüğüne bakın."
            fi
            echo
            echo "Cihaz testleri (özellikle el yazısı, tablo, PDF çıktısı, Free limitleri ve"
            echo "release Mock Pro kontrolü) otomatik yapılamaz: \`docs/TEST_PLANI.md\`"
            echo "bölüm H, T, O, P ve R."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== SONUÇ ==="
          echo "flutter clean                : $(mark "$R_CLEAN")"
          echo "flutter pub get              : $(mark "$R_PUBGET")"
          echo "flutter analyze              : $(mark "$R_ANALYZE")"
          echo "flutter test                 : $(mark "$R_TEST")"
          echo "flutter build apk --release  : $(mark "$R_RELEASE")"
          echo "release güvenlik doğrulaması : $(mark "$R_GUARDS")"

          if [ "$R_CLEAN" != "success" ] || [ "$R_PUBGET" != "success" ] || \
             [ "$R_ANALYZE" != "success" ] || \
             [ "$R_TEST" != "success" ] || [ "$R_RELEASE" != "success" ] || \
             [ "$R_GUARDS" != "success" ]; then
            echo "Bir veya daha fazla adım başarısız / atlandı. Yukarıdaki adım günlüklerine bakın."
            exit 1
          fi
          echo "Tüm kalite kontrolleri geçti."
