name: metincep
description: "MetinCep - Fotoğraf ve PDF'lerden cihaz üzerinde metin çıkarma uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Cihaz üzerinde OCR (Google ML Kit, Latin alfabesi modeli - Türkçe dahil)
  google_mlkit_text_recognition: ">=0.13.0 <1.0.0"
  # Kamera ve galeriden fotoğraf alma (ek izin gerektirmez)
  image_picker: ^1.1.2
  # PDF seçme ve TXT dosyası kaydetme (Android sistem dosya seçicisi)
  file_picker: ">=8.1.0 <11.0.0"
  # PDF metin katmanı okuma + sayfaları görüntüye çevirme (PDFium)
  pdfrx: ">=1.3.0 <2.0.0"
  # Android paylaşım menüsü
  share_plus: ">=11.0.0 <14.0.0"
  # Uygulama klasörleri (yerel kayıtlar)
  path_provider: ^2.1.4
  # PDF OLUŞTURMA (çıktı): metin / fotoğraf / tablo → PDF. Saf Dart, çevrimdışı.
  # Üst sınır 3.13.0: 3.13+ Dart 3.12 ister, bu proje Flutter 3.35 (Dart 3.9) ile çalışır.
  pdf: ">=3.11.0 <3.13.0"
  # Görüntü ön işleme (el yazısı profili) ve PDF için fotoğraf ölçekleme. Saf Dart.
  image: ">=4.2.0 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # PDF çıktısında Türkçe karakterler için gömülü Unicode yazı tipi.
    # PDF'in yerleşik fontları ş, ğ, İ, ı harflerini içermez.
    - assets/fonts/DejaVuSans.ttf
